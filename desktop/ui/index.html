<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teamsrec</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2129; --muted: #6b7280; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --fg: #e6e8ec; --muted: #9aa3b2; --err: #f07f7f; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 560px; padding: 0 20px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #msg { color: var(--muted); }
  #msg.err { color: var(--err); white-space: pre-wrap; text-align: left; }
</style>
</head>
<body>
<main>
  <h1>teamsrec</h1>
  <!-- the desktop shell replaces this page with the review page as soon as its server answers -->
  <p id="msg">Spouštím stránku kontroly přepisů…</p>
</main>
</body>
</html>
