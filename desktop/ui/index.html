<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teamsrec</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2129; --muted: #6b7280; --err: #b91c1c; --line: #e3e6ea; --accent: #2f5bd1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --fg: #e6e8ec; --muted: #9aa3b2; --err: #f07f7f; --line: #2c3038; --accent: #6f8ff0; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 640px; padding: 0 20px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #msg { color: var(--muted); }
  #msg.err { color: var(--err); white-space: pre-wrap; text-align: left; }
  #line { font: 13px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); min-height: 1.4em; margin: 10px 0 0;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #time { font-size: 13px; color: var(--muted); }
  button { margin-top: 14px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent);
           color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>teamsrec</h1>
  <!-- the desktop shell replaces this page with the review page as soon as its server answers; before that, in the
       installed suite, it may prepare the Python environment and report here (showProgress / showError) -->
  <p id="msg">Spouštím stránku kontroly přepisů…</p>
  <p id="line" hidden></p>
  <p id="time" hidden></p>
  <button id="retry" type="button" hidden>Zkusit znovu</button>
</main>
<script>
  const $ = id => document.getElementById(id);
  let since = 0, timer = 0;
  function tick() {
    const s = Math.round((Date.now() - since) / 1000);
    $("time").textContent = `běží ${Math.floor(s / 60)} min ${s % 60} s`;
  }
  function showProgress(headline, line) {
    $("msg").className = ""; $("msg").textContent = headline; $("retry").hidden = true;
    if (!since) { since = Date.now(); $("time").hidden = false; timer = setInterval(tick, 1000); tick(); }
    if (line) { $("line").hidden = false; $("line").textContent = line; }
  }
  function showError(text) {
    clearInterval(timer); since = 0; $("time").hidden = true; $("line").hidden = true;
    $("msg").className = "err"; $("msg").textContent = text;
    $("retry").hidden = !(window.__TAURI__ && window.__TAURI__.core);
  }
  $("retry").onclick = () => {
    showProgress("Zkouším znovu…", null);
    window.__TAURI__.core.invoke("retry");
  };
</script>
</body>
</html>
