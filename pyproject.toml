[project]
name = "teamsrec-transcribe"
version = "0.1.0"
description = "Transcription, speaker attribution, exports and summaries for teamsrec meeting recordings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "drzdez" }]
dependencies = [
    "typer>=0.15",
    "numpy>=1.26",
    "anthropic>=1.0",
    "pywin32>=306; sys_platform == 'win32'",  # Outlook calendar via COM (optional feature, [calendar] outlook)
]

[project.optional-dependencies]
# Local transcription on NVIDIA GPU. whisperx pins torch~=2.8; the CUDA build comes from the index below.
whisperx = [
    "whisperx>=3.8,<3.9",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]
# Active-speaker timeline from Teams video (needs torch as well, via easyocr).
video = [
    "scipy>=1.11",
    "easyocr>=1.7",
    "opencv-python-headless>=4.9",
]
all = ["teamsrec-transcribe[whisperx,video]"]

[project.scripts]
teamsrec-transcribe = "teamsrec_transcribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamsrec_transcribe"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# torch wheels from the CUDA 12.8 index on Windows/Linux; other platforms fall back to PyPI (CPU) builds.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
