<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teamsrec – schůzky</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1d2129; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2f5bd1; --accent-fg: #ffffff; --warn: #b45309; --ok: #15803d; --err: #b91c1c; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2026; --fg: #e6e8ec; --muted: #9aa3b2; --line: #2c3038;
      --accent: #6f8ff0; --accent-fg: #0f1320; --warn: #f0b458; --ok: #5cc98a; --err: #f07f7f; --chip: #262b3a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
  header select { max-width: 40vw; }
  header input#title { width: 26vw; min-width: 200px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-weight: 600; }
  header input#title:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #status.busy { color: var(--warn); font-weight: 600; }
  #events { position: fixed; right: 12px; bottom: 52px; width: min(640px, 92vw); max-height: 45vh; overflow-y: auto;
            background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
            font-size: 13px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #events .ev { padding: 2px 0; border-bottom: 1px solid var(--line); }
  #events .ev:last-child { border-bottom: 0; }
  #events .at { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 8px; }
  #events .ev.err .tx { color: var(--err); }
  #events .ev.busy .tx { color: var(--warn); }
  #events .empty-ev { color: var(--dim); }
  #help { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 30; padding: 16px 20px 0; }
  #help .helpBar { max-width: 1000px; margin: 0 auto 10px; display: flex; gap: 12px; align-items: center; }
  #help main.doc { border-radius: 10px; }
  main.doc a { color: var(--accent); }
  #dirty.changed { color: var(--warn); font-weight: 600; }
  #dirty.clean { color: var(--ok); }
  .tabs { display: flex; gap: 2px; margin-left: auto; }
  .tabs button { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 12px; cursor: pointer; font: inherit; }
  .tabs button:first-child { border-radius: 8px 0 0 8px; } .tabs button:last-child { border-radius: 0 8px 8px 0; }
  .tabs button.active { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .meta { color: var(--muted); font-size: 13px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 20px 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0;
          display: grid; grid-template-columns: 1fr 360px; gap: 12px 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  .card.done { opacity: .85; }
  .label { font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  .label.named { font-family: inherit; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .hint { margin: 6px 0 0; color: var(--warn); font-size: 14px; }
  .voice { margin: 6px 0 0; color: var(--ok); font-size: 14px; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .samples button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .samples button.playing { border-color: var(--accent); color: var(--accent); }
  td.samples { display: table-cell; } td.samples button { margin: 2px 4px 2px 0; }
  .excerpt { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .excerpt b { color: var(--fg); font-weight: 500; }
  .side { display: flex; flex-direction: column; gap: 8px; }
  .shown { font-size: 13px; color: var(--muted); }
  .shown b { color: var(--fg); font-weight: 500; }
  input[type=text], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .same { font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 13px; color: var(--muted); font-weight: 500; }
  td input[type=text], td select { padding: 6px 8px; }
  td.act { width: 44px; text-align: center; }
  td.act button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .people-help { color: var(--muted); font-size: 13px; margin: 8px 0 14px; }
  .person-h { font-size: 20px; margin: 10px 0 4px; }
  button.link { border: 0; background: transparent; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  button.link.danger { color: var(--err); margin-top: 12px; }
  button.link.small { font-size: 12px; margin-top: 4px; text-align: left; }
  button.armed, button.link.armed, td.act button.armed { background: var(--err) !important; color: #fff !important; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; }
  button.link.cancel { margin-left: 8px; font-size: 13px; color: var(--muted); }
  button.primary-btn { padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button.primary-btn:disabled { opacity: .5; cursor: default; }
  .empty p { margin: 6px 0; }
  .toolbar { margin: 4px 0 10px; }
  .subtabs { max-width: 1000px; margin: 12px auto 0; padding: 0 20px; display: flex; gap: 2px; align-items: center; }
  .subtabs button { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 14px; cursor: pointer; font: inherit; border-radius: 8px 8px 0 0; border-bottom: 0; }
  .subtabs button.active { background: var(--card); font-weight: 600; }
  .subtabs select { margin-left: auto; width: auto; padding: 4px 8px; font-size: 13px; }
  main.doc { background: var(--card); border: 1px solid var(--line); border-radius: 0 10px 10px 10px; padding: 18px 28px; margin-top: 0; line-height: 1.55;
             margin-bottom: 120px; }  /* the card's own padding replaces main's, so keep the end clear of the fixed footer */
  main.doc h1 { font-size: 22px; margin: 0 0 12px; } main.doc h2 { font-size: 17px; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  main.doc h3 { font-size: 15px; margin: 16px 0 6px; }
  main.doc table { width: auto; margin: 6px 0 10px; } main.doc th, main.doc td { padding: 5px 10px; font-size: 14px; }
  main.doc ul, main.doc ol { margin: 4px 0 8px; padding-left: 24px; } main.doc li { margin: 2px 0; }
  main.doc code { background: var(--chip); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  main.doc .meta-block { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  main.doc .line { display: grid; grid-template-columns: 70px 150px 1fr; gap: 10px; padding: 2px 0; border-bottom: 1px dotted var(--line); font-size: 14px; }
  main.doc .line .t { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding-top: 2px; }
  main.doc .line .who { font-weight: 600; }
  main.doc .stamp { color: var(--muted); font-size: 12px; }
  .meeting { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin: 4px 0 12px; font-size: 14px; }
  .meeting .row2 { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  #filter { min-width: 160px; }
  #filter.bad { border-color: var(--warn); }
  .titles { display: flex; gap: 6px; flex-wrap: wrap; flex-basis: 100%; align-items: center; }
  .titles .presetLabel { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .titles button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px;
                   padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .titles button:hover { color: var(--fg); }
  .titles button.on { border-color: var(--accent); color: var(--accent); }
  .badge { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }
  .meeting button.play { margin-left: 4px; }
  button.play { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
  button.play.playing { border-color: var(--accent); color: var(--accent); }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line);
           padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  footer button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  footer button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
  footer button:disabled { opacity: .5; cursor: default; }
  #status { margin-left: auto; font-size: 14px; color: var(--muted); }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  kbd { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  [hidden] { display: none !important; }
  @media (max-width: 720px) { .card { grid-template-columns: 1fr; } header select { max-width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>teamsrec</h1>
  <select id="pick" title="nahrávka"></select>
  <input id="filter" type="search" placeholder="filtr (text nebo regexp)"
         title="Omezí seznam nahrávek: píšete text (nezáleží na velikosti písmen ani diakritice) nebo regulární výraz, třeba ^archi|standup$">
  <span class="meta" id="filterCount"></span>
  <input id="title" type="text" placeholder="název schůzky" title="název schůzky – uloží se tlačítkem Uložit; složka i soubory nahrávky se přejmenují podle něj">
  <span class="meta" id="meta"></span>
  <span class="meta" id="scope" hidden>společný seznam lidí pro všechny nahrávky</span>
  <div id="titles" class="titles"><span class="presetLabel">Předvolby:</span></div>
  <div class="tabs">
    <button id="tabSpeakers" class="active" type="button">Schůzka</button>
    <button id="tabPeople" type="button">Lidé (společné)</button>
    <button id="helpBtn" type="button" title="uživatelská příručka, instalace a konfigurace, soukromí">Nápověda</button>
  </div>
</header>
<nav id="subtabs" class="subtabs">
  <button data-sub="speakers" class="active" type="button">Mluvčí</button>
  <button data-sub="transcript" type="button">Přepis</button>
  <button data-sub="summary" type="button">Zápis</button>
  <select id="docPick" hidden></select>
</nav>
<main id="main"><div class="empty">Načítám…</div></main>
<main id="docMain" class="doc" hidden></main>
<main id="peopleMain" hidden></main>
<footer>
  <span id="speakerButtons">
    <button id="save" class="primary">Uložit</button>
    <button id="saveSum">Uložit a přegenerovat zápis</button>
  </span>
  <span id="peopleButtons" hidden>
    <button id="savePeople" class="primary">Uložit lidi</button>
    <button id="addPerson">Přidat osobu</button>
  </span>
  <button id="quit">Zavřít</button>
  <button id="histBtn" title="co server udělal, od spuštění stránky">Historie</button>
  <span id="dirty" class="meta"></span>
  <span class="meta" id="tip">Tip: <kbd>Enter</kbd> = další řečník, <kbd>Esc</kbd> = zastavit přehrávání</span>
  <span id="status"></span>
</footer>
<div id="events" hidden></div>
<div id="help" hidden>
  <div class="helpBar">
    <strong>Nápověda</strong>
    <select id="helpPick">
      <option value="user-guide">Uživatelská příručka</option>
      <option value="install">Instalace a konfigurace</option>
      <option value="privacy">Soukromí a hlasové otisky</option>
    </select>
    <button id="helpClose" type="button" class="play">✕ Zavřít (Esc)</button>
  </div>
  <main id="helpMain" class="doc"></main>
</div>
<audio id="audio"></audio>

<script>
// @ts-check
/**
 * @typedef {{start:number,end:number,at:string,text:string}} Sample
 * @typedef {{id:string,full:string,nick:string,shown:string}} PersonInfo
 * @typedef {{first:string,last:string,nick:string,display:string}} Fields
 * @typedef {{label:string,unresolved:boolean,name:string,fields:Fields,person:PersonInfo|null,voice:VoiceMatch|null,voice_hint:VoiceHint|null,confirmed?:boolean,seconds:number,count:number,hint:string,samples:Sample[],excerpts:{at:string,text:string}[]}} Speaker
 * @typedef {{id:string,first:string,last:string,nick:string,display:string,aliases:string[],prints?:number,voiceprint?:boolean}} Person
 * @typedef {{person:string,score:number,name:string}} VoiceMatch
 * @typedef {{person:string,name:string,score:number,fields:Fields,why:string,threshold:number}} VoiceHint
 * @typedef {{subject:string,start:string,end:string,teams:boolean,attendees?:string[],organizer?:string}} Candidate
 * @typedef {{source:string,subject:string,organizer:string,start:string,end:string,match:string,status:string,candidates:Candidate[]}} Calendar
 * @typedef {{title:string,title_source:string,calendar:Calendar|null,participants:{name:string,source:string}[],outlook_enabled:boolean,start:string}} Meeting
 * @typedef {{person:string,labels:string[],name:string}} SamePerson
 * @typedef {{stem:string,title:string,start:string,duration_s:number,source:string,transcribed:boolean,language:string|null,speaker_sources:string[],has_summary:boolean,has_mix:boolean,speakers:Speaker[],known_names:string[],people:Person[],display_default:string,meeting?:Meeting,same_person?:SamePerson[],can_unmerge?:boolean}} Review
 * @typedef {{stem:string,title:string,start:string,transcribed:boolean,unresolved:number|null,summary?:boolean}} RecordingRow
 */

const $ = (/** @type {string} */ id) => /** @type {HTMLElement} */ (document.getElementById(id));
const main = $("main"), peopleMain = $("peopleMain"), pick = /** @type {HTMLSelectElement} */ ($("pick")), meta = $("meta"), status = $("status");
const audio = /** @type {HTMLAudioElement} */ ($("audio"));
const titleInput = /** @type {HTMLInputElement} */ ($("title"));
let busy = false;  // a summary is being generated on the server
let baseline = "";  // names + title as loaded; anything else = unsaved changes

function snapshot() { return JSON.stringify({ names: collectNames(), title: titleInput.value.trim() }); }
function markClean() { baseline = snapshot(); updateDirty(); }
function isDirty() { return baseline !== "" && snapshot() !== baseline; }
function updateDirty() {
  const d = $("dirty");
  if (!review || !review.transcribed) { d.textContent = ""; d.className = "meta"; return; }
  if (isDirty()) { d.textContent = "● neuložené změny – Uložit je zapíše do přepisu a titulků"; d.className = "meta changed"; }
  else { d.textContent = "✓ vše uloženo; Uložit je potřeba jen po změně, zápis se přegenerovává jen na vyžádání"; d.className = "meta clean"; }
}
document.addEventListener("input", ev => { if (ev.target instanceof HTMLInputElement || ev.target instanceof HTMLSelectElement) updateDirty(); });
document.addEventListener("change", ev => { if (ev.target instanceof HTMLSelectElement) updateDirty(); });
const MODE_LABEL = { "": "výchozí", first: "jméno", full: "jméno a příjmení", nick: "přezdívka" };
/** @type {Review|null} */ let review = null;
/** @type {Person[]} */ let people = [];
let displayDefault = "nick";
/** @type {HTMLButtonElement|null} */ let playingBtn = null;
let loadSeq = 0;  // guards against a slower, older recording load overwriting the newer one

/** @param {string} url @param {RequestInit=} init */
/** /api/recordings/<stem>/<rest> with the stem and every path part escaped */
function recUrl(/** @type {string} */ stem, /** @type {string[]} */ ...parts) {
  return ["/api/recordings", stem, ...parts].map((x, i) => i ? encodeURIComponent(x) : x).join("/");
}
/** @param {string} method @param {any=} body */
function send(method, body) {
  return { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) };
}

async function api(url, init) {
  const r = await fetch(url, init);
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

/** @param {string} msg @param {"ok"|"err"|"busy"|""=} kind */
function setStatus(msg, kind = "") { status.textContent = msg; status.className = kind; }
function setBusy(/** @type {boolean} */ on) {
  busy = on;
  const quit = /** @type {HTMLButtonElement} */ ($("quit"));
  quit.disabled = on; quit.title = on ? "zápis se generuje, počkejte na dokončení" : "";
}
window.addEventListener("beforeunload", ev => { if (busy || isDirty()) { ev.preventDefault(); ev.returnValue = ""; } });
function fmtMin(/** @type {number} */ s) { return s >= 60 ? `${(s / 60).toFixed(1)} min` : `${Math.round(s)} s`; }
function fmtDate(/** @type {string} */ iso) { return iso ? iso.replace("T", " ").slice(0, 16) : ""; }
function emptyBox(/** @type {string} */ text) {
  const d = document.createElement("div"); d.className = "empty"; d.textContent = text; return d;
}

/** a delete button that needs a second click within 3 s (no browser dialogs) */
function armedButton(/** @type {HTMLButtonElement} */ btn, /** @type {string} */ confirmText, /** @type {() => void} */ action) {
  const original = btn.textContent;
  const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "link cancel"; cancel.textContent = "Zrušit"; cancel.hidden = true;
  const disarm = () => { delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = original; cancel.hidden = true; };
  btn.insertAdjacentElement("afterend", cancel);
  cancel.onclick = () => { disarm(); if (status.textContent.startsWith("zatím se nic")) setStatus(""); };
  btn.onclick = () => {
    if (btn.dataset.armed) { disarm(); action(); return; }
    btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = confirmText; cancel.hidden = false;
    setStatus("zatím se nic nesmazalo – potvrďte kliknutím na červené tlačítko, nebo Zrušit", "busy");
  };
}

function escapeHtml(/** @type {string} */ s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c] || c);
}

// ---------------------------------------------------------------- recordings

/** @type {RecordingRow[]} */
let allRows = [];
const filterInput = /** @type {HTMLInputElement} */ ($("filter"));

/** lower case without diacritics, so "archi" finds "Archi board" and "Zdeněk" finds "Zdenek" */
function foldText(/** @type {string} */ s) {
  return s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

/** the filter is a regular expression when it compiles, otherwise plain text */
function rowMatcher(/** @type {string} */ text) {
  const q = foldText(text.trim());
  if (!q) return () => true;
  let re = null;
  try { re = new RegExp(q); } catch { re = null; }
  filterInput.classList.toggle("bad", re === null && /[[\](){}*+?|\\^$]/.test(q));
  return (/** @type {RecordingRow} */ r) => {
    const hay = foldText(`${r.title} ${r.stem}`);
    return re ? re.test(hay) : hay.includes(q);
  };
}

/** @param {boolean} [jump] switch to the newest match instead of keeping what is open (preset filters) */
/** what is done with a recording: the dropdown has no colours, so it says it in words */
function rowState(/** @type {RecordingRow} */ r) {
  if (!r.transcribed) return { key: "no-transcript", text: "○ bez přepisu" };
  const missing = [];
  if (r.summary === false) missing.push("bez zápisu");  // undefined = an older server that does not say
  if (r.unresolved) missing.push(`${r.unresolved} nepojmenovaných`);
  if (!missing.length) return { key: "done", text: "✓ hotovo" };
  return { key: r.summary === false ? "no-summary" : "unresolved", text: `◐ ${missing.join(", ")}` };
}

/** @type {string} */
let stateFilter = "";

function renderPick(jump) {
  const match = rowMatcher(filterInput.value);
  const shown = allRows.filter(r => match(r) && (!stateFilter || rowState(r).key === stateFilter
    || (stateFilter === "todo" && rowState(r).key !== "done")));
  const hits = shown.length;
  let current = pick.value;
  if (jump && hits && !shown.some(r => r.stem === current)) current = shown[0].stem;
  // never hide what is open - the select would jump to another recording - but say why it is there
  const openOutside = current && !shown.some(r => r.stem === current)
    ? allRows.find(r => r.stem === current) || null : null;
  if (openOutside) shown.unshift(openOutside);
  pick.innerHTML = "";
  for (const r of shown) {
    const o = document.createElement("option");
    o.value = r.stem;
    o.textContent = `${fmtDate(r.start)} – ${r.title} [${rowState(r).text}]`
      + (openOutside && r.stem === openOutside.stem ? " (otevřená, mimo filtr)" : "");
    pick.appendChild(o);
  }
  if (current && shown.some(r => r.stem === current)) pick.value = current;
  $("filterCount").textContent = filterInput.value.trim() || stateFilter ? `${hits} z ${allRows.length}` : "";
  renderTitles();
  return pick.value;
}

function renderTitles() {
  const box = $("titles");
  /** @type {Map<string, number>} */ const counts = new Map();
  for (const r of allRows) {
    const t = (r.title || "").trim();
    if (t) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "cs")).slice(0, 10);
  const active = foldText(filterInput.value.trim());
  box.innerHTML = '<span class="presetLabel">Předvolby:</span>';
  const todo = allRows.filter(r => rowState(r).key !== "done").length;
  if (todo) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `◐ nezpracované (${todo})`;
    b.title = "nahrávky bez přepisu, bez zápisu nebo s nepojmenovanými mluvčími";
    if (stateFilter === "todo") b.classList.add("on");
    b.onclick = () => {
      stateFilter = stateFilter === "todo" ? "" : "todo";
      const stem = renderPick(true);
      if (stem && (!review || stem !== review.stem)) loadRecording(stem);
    };
    box.appendChild(b);
  }
  for (const [title, n] of top) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n > 1 ? `${title} (${n})` : title;
    b.title = `zobrazit jen nahrávky „${title}“`;
    if (active && foldText(title) === active) b.classList.add("on");
    b.onclick = () => {
      filterInput.value = b.classList.contains("on") ? "" : title;
      const stem = renderPick(true);  // a preset shows its own recordings, so open the newest one
      if (stem && (!review || stem !== review.stem)) loadRecording(stem);
    };
    box.appendChild(b);
  }
}

async function loadList() {
  allRows = await api("/api/recordings?limit=500");
  const wanted = location.hash.slice(1);
  if (wanted && allRows.some(r => r.stem === wanted)) pick.value = wanted;
  renderPick();
  if (wanted && allRows.some(r => r.stem === wanted)) pick.value = wanted;
  else if (!pick.value && pick.options.length) pick.value = pick.options[0].value;
}

async function loadRecording(/** @type {string} */ stem) {
  stopAudio();
  setStatus("");
  const seq = ++loadSeq;
  main.innerHTML = '<div class="empty">Načítám…</div>';
  /** @type {Review} */ let r;
  try {
    r = await api(recUrl(stem));
  } catch (e) {
    if (seq === loadSeq) { main.innerHTML = `<div class="empty">${escapeHtml(String(e))}</div>`; review = null; }
    return;
  }
  if (seq !== loadSeq) return;  // the user already switched to another recording
  review = r;
  location.hash = stem;
  titleInput.value = r.title || "";
  people = r.people; displayDefault = r.display_default;
  if (!r.transcribed) {
    meta.textContent = `${fmtDate(r.start)} · ${Math.round((r.duration_s || 0) / 60)} min · bez přepisu`;
    showSub("speakers", false);
    renderNotTranscribed(r);
    baseline = ""; updateDirty();
    return;
  }
  meta.textContent = `${fmtDate(r.start)} · ${Math.round((r.duration_s || 0) / 60)} min · ${r.language || "?"} · mluvčí z: ${(r.speaker_sources || []).join(", ") || "diarizace"}`;
  renderSpeakers();
  markClean();
  docPick.innerHTML = ""; docPick.dataset.stem = "";
  showSub(subTab, subTab !== "speakers");
}

/** @param {Review} r */
function renderNotTranscribed(r) {
  main.innerHTML = "";
  const box = document.createElement("div"); box.className = "empty";
  const mins = Math.round((r.duration_s || 0) / 60);
  const est = Math.max(2, Math.round(mins / 6) + 3);
  box.innerHTML = `<p><b>${escapeHtml(r.title)}</b> ještě nemá přepis, takže není co kontrolovat.</p>` +
    (r.has_mix ? `<p>Přepsat, exportovat a udělat zápis teď? Zhruba ${est} min, grafická karta bude po tu dobu vytížená.</p>`
               : `<p>Nahrávka nemá zvuk (chybí mix i stopy), přepsat ji nejde.</p>`);
  if (r.has_mix) {
    const b = document.createElement("button"); b.type = "button"; b.className = "primary-btn";
    b.textContent = "Ano, přepsat a zpracovat";
    b.onclick = () => startProcess(r.stem, b);
    box.appendChild(b);
  }
  main.appendChild(box);
}

async function startProcess(/** @type {string} */ stem, /** @type {HTMLButtonElement} */ btn) {
  btn.disabled = true;
  const since = finishes;
  try {
    const r = await api(recUrl(stem, "process"), send("POST"));
    if (!r.ok) throw new Error(r.error || "nelze spustit");
  } catch (e) { setStatus(String(e), "err"); btn.disabled = false; return; }
  setBusy(true);
  setStatus("zpracovávám: přepis, export, zápis… nezavírejte stránku ani okno konzole", "busy");
  let error = "";
  try { error = await waitForJob(since); }
  catch (e) { error = String(e); }
  finally { setBusy(false); }
  await loadList(); pick.value = stem; await loadRecording(stem);  // clears the status line, so write it after
  if (error) setStatus(`zpracování selhalo: ${error}`, "err");
  else setStatus("hotovo: přepis, titulky i zápis", "ok");
}

// ---------------------------------------------------------------- speakers tab

function renderSpeakers() {
  if (!review) return;
  main.innerHTML = "";
  if (!review.speakers.length) { main.appendChild(emptyBox("V přepisu nejsou žádní mluvčí.")); return; }
  if (review.meeting) main.appendChild(meetingPanel(review.meeting));
  if (review.speakers.some(sp => sp.unresolved && !sp.person)) {
    const bar = document.createElement("div"); bar.className = "toolbar";
    const b = document.createElement("button"); b.type = "button"; b.className = "play";
    b.textContent = "Zkusit poznat neznámé po hlase (podle otisků uložených od té doby)";
    b.onclick = async () => {
      b.disabled = true; setStatus("porovnávám s otisky…");
      try {
        const r = await api(recUrl(review ? review.stem : "", "recognize"), send("POST"));
        const n = Object.keys(r.matches).length;
        if (review) { const stem = review.stem; await loadList(); pick.value = stem; await loadRecording(stem); }
        setStatus(n ? `poznáno ${n} mluvčích, uloženo do přepisu a titulků; zápis přegenerujte tlačítkem dole` : "nikdo nepoznán (shoda pod prahem nebo příliš krátká promluva)", n ? "ok" : "");
      } catch (e) { setStatus(String(e), "err"); b.disabled = false; }
    };
    bar.appendChild(b); main.appendChild(bar);
  }
  const same = review.same_person || [];
  if (same.length) {
    const bar = document.createElement("div"); bar.className = "toolbar";
    const extra = same.reduce((n, g) => n + g.labels.length - 1, 0);
    const b = document.createElement("button"); b.type = "button"; b.className = "play";
    b.textContent = `Sloučit podle osoby (${extra > 1 ? extra + " označení navíc" : "1 označení navíc"})`;
    b.title = "Označení, která patří jedné osobě, se spojí do jednoho mluvčího; jejich hlasové vzorky zůstanou "
      + "jako otisky, pokud se dost liší:\n"
      + same.map(g => `${g.name || g.person}: ${g.labels.join(" + ")}`).join("\n");
    b.onclick = async () => {
      if (isDirty()) { setStatus("nejdřív uložte jména (slučuje se podle uloženého přiřazení)", "err"); return; }
      b.disabled = true; setStatus("slučuji…");
      try {
        const stem = review ? review.stem : "";
        const r = await api(recUrl(stem, "speakers", "merge"), send("POST"));
        await loadList(); pick.value = stem; await loadRecording(stem);
        setStatus(r.merged ? `sloučeno ${r.merged} označení, přepis a titulky přegenerovány`
                             + (r.prints ? `; hlasových otisků přibylo ${r.prints}` : "; nové otisky nepřibyly (vzorky byly skoro stejné)")
                           : "nebylo co sloučit", r.merged ? "ok" : "");
      } catch (e) { setStatus(String(e), "err"); b.disabled = false; }
    };
    bar.appendChild(b); main.appendChild(bar);
  }
  {
    const bar = document.createElement("div"); bar.className = "toolbar";
    const b = document.createElement("button"); b.type = "button"; b.className = "play";
    const mins = Math.max(2, Math.round((review.duration_s || 0) / 60 / 6) + 3);
    b.textContent = "Přepsat znovu od nuly";
    b.title = "Nový přepis, diarizace i analýza oken Teams (transcribe --force): mluvčí se rozdělí znovu, "
      + "jmenovky z videa se přečtou znovu a ruční přiřazení jmen u této nahrávky se zahodí. "
      + "Hodí se, když se do jednoho označení promíchali dva lidé.";
    armedButton(b, `Potvrdit nový přepis (~${mins} min, jména se zahodí)`, async () => {
      const stem = review ? review.stem : "";
      setStatus("spouštím nový přepis…");
      try {
        const r = await api("/api/process", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ stem, force: true }) });
        if (!r.ok) throw new Error(r.error || "nelze spustit");
      } catch (e) { setStatus(String(e), "err"); return; }
      setBusy(true);
      try { await waitForSummary(); } finally { setBusy(false); }
      await loadList(); pick.value = stem; await loadRecording(stem);
      setStatus("hotovo: nový přepis, mluvčí jsou znovu k pojmenování", "ok");
    });
    bar.appendChild(b); main.appendChild(bar);
  }
  if (review.can_unmerge) {
    const bar = document.createElement("div"); bar.className = "toolbar";
    const u = document.createElement("button"); u.type = "button"; u.className = "play";
    u.textContent = "Vrátit sloučení";
    u.title = "Vrátí repliky pod původní označení (například když se sloučili dva různí lidé)";
    u.onclick = async () => {
      u.disabled = true; setStatus("vracím…");
      try {
        const stem = review ? review.stem : "";
        const r = await api(recUrl(stem, "speakers", "unmerge"), send("POST"));
        await loadList(); pick.value = stem; await loadRecording(stem);
        setStatus(`vráceno ${r.restored} replik pod původní označení`, "ok");
      } catch (e) { setStatus(String(e), "err"); u.disabled = false; }
    };
    bar.appendChild(u); main.appendChild(bar);
  }
  review.speakers.forEach((sp, i) => main.appendChild(card(sp, i)));
}

/** what the exports will print for these fields (same rules as the server) */
function shownFor(/** @type {Fields} */ f) {
  const mode = f.display || displayDefault;
  if (mode === "nick" && f.nick) return f.nick;
  if ((mode === "nick" || mode === "first") && f.first) return f.first;
  return `${f.first} ${f.last}`.trim() || f.nick;
}

/** the registered person these fields point to, if any (full name, or nickname alone) */
function personFor(/** @type {Fields} */ f) {
  const full = `${f.first} ${f.last}`.trim().toLocaleLowerCase("cs");
  const nick = f.nick.trim().toLocaleLowerCase("cs");
  return people.find(p => (full && `${p.first} ${p.last}`.trim().toLocaleLowerCase("cs") === full) || (!full && nick && p.nick.toLocaleLowerCase("cs") === nick)) || null;
}

const SOURCE_LABEL = { calendar: "z kalendáře", window: "z okna Teams", manual: "ručně", file: "z názvu souboru",
  "teams-name": "z názvu souboru Teams", container: "z metadat souboru", generic: "obecný titulek okna", unknown: "?" };
const MATCH_LABEL = { title: "podle názvu schůzky", time: "jen podle času, ověřte", manual: "vybráno ručně" };

/** @param {Meeting} m */
function meetingPanel(m) {
  const box = document.createElement("div"); box.className = "meeting";
  const cal = m.calendar;
  const head = document.createElement("div"); head.className = "row2";
  head.innerHTML = `<b>Schůzka</b> název <span class="badge">${escapeHtml(SOURCE_LABEL[m.title_source] || m.title_source)}</span>` +
    (cal ? ` · kalendář: <b>${escapeHtml(cal.subject || "")}</b> ${escapeHtml((cal.start || "").slice(11, 16))}–${escapeHtml((cal.end || "").slice(11, 16))}` +
           (cal.organizer ? `, organizátor ${escapeHtml(cal.organizer)}` : "") +
           `<span class="badge ${cal.status === "confirmed" ? "ok" : ((cal.match || "time") === "time" ? "warn" : "")}">${cal.status === "confirmed" ? "potvrzeno" : escapeHtml(MATCH_LABEL[cal.match || "time"] || cal.match)}</span>`
         : ` · <span class="badge warn">bez schůzky v kalendáři</span>`);
  box.appendChild(head);
  const people = document.createElement("div"); people.className = "row2";
  people.innerHTML = "účastníci: " + (m.participants.length
    ? m.participants.map(p => `${escapeHtml(p.name)}<span class="badge">${escapeHtml(SOURCE_LABEL[p.source] || p.source)}</span>`).join(" ")
    : "<span class='meta'>žádní</span>");
  box.appendChild(people);
  const actions = document.createElement("div"); actions.className = "row2";
  const btn = (/** @type {string} */ text, /** @type {() => void} */ fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "play"; b.textContent = text; b.onclick = fn; actions.appendChild(b); return b; };
  if (cal && cal.status !== "confirmed") btn("Potvrdit spojení se schůzkou", () => meetingAction("confirm"));
  if (cal) btn("Odpojit od schůzky", () => meetingAction("detach"));
  if (m.outlook_enabled) {
    const sel = document.createElement("select"); sel.className = "same"; sel.style.width = "auto";
    sel.innerHTML = '<option value="">spojit s jinou schůzkou z kalendáře…</option>';
    let loaded = false;
    sel.onfocus = async () => {
      if (loaded || !review) return; loaded = true;
      try {
        const r = await api(recUrl(review.stem, "meeting", "candidates"));
        for (const c of r.candidates) {
          const o = document.createElement("option"); o.value = JSON.stringify({ subject: c.subject, start: c.start });
          o.textContent = `${c.start.slice(11, 16)}–${c.end.slice(11, 16)} ${c.subject}${c.teams ? " (Teams)" : ""}, ${(c.attendees || []).length} lidí`;
          sel.appendChild(o);
        }
        if (r.candidates.length === 0) { const o = document.createElement("option"); o.disabled = true; o.textContent = "v kalendáři nic v okolí"; sel.appendChild(o); }
      } catch (e) { setStatus(String(e), "err"); }
    };
    sel.onchange = () => { if (sel.value) meetingAction("attach", JSON.parse(sel.value)); };
    actions.appendChild(sel);
  }
  if (actions.children.length) box.appendChild(actions);
  return box;
}

async function meetingAction(/** @type {string} */ action, /** @type {any=} */ candidate) {
  if (!review) return;
  setStatus(action === "attach" ? "spojuji se schůzkou (přejmenuje se složka)…" : "ukládám…");
  try {
    const r = await api(recUrl(review.stem, "meeting"), send("POST", { action, candidate: candidate || null }));
    await loadList(); pick.value = r.stem; await loadRecording(r.stem);
    setStatus({ confirm: "spojení potvrzeno", detach: "odpojeno; účastníci z kalendáře odebráni, název zůstal (upravte nahoře)",
                attach: "spojeno s vybranou schůzkou: název, účastníci a složka" }[action] || "hotovo", "ok");
  } catch (e) { setStatus(String(e), "err"); }
}

/** @param {Speaker} sp @param {number} i */
function card(sp, i) {
  const c = document.createElement("section");
  c.className = "card" + (sp.unresolved ? "" : " done");
  const left = document.createElement("div");
  const named = sp.name && sp.name !== sp.label ? sp.name : "";
  left.innerHTML = `<span class="label ${sp.unresolved ? "" : "named"}">${escapeHtml(named || sp.label)}</span>` +
    (named ? `<span class="chip" title="označení v přepisu (z diarizace, videa nebo mikrofonu)">${escapeHtml(sp.label)}</span>` : "") +
    (named && !sp.confirmed ? '<span class="chip" title="jméno odhadla aplikace (jmenovka z videa, mikrofonní stopa, '
      + 'hlasový otisk). Uložením ho potvrdíte – teprve pak se hlasový vzorek uloží mezi otisky a osoba do '
      + 'společného seznamu lidí.">nepotvrzeno</span>' : "") +
    `<span class="chip">${fmtMin(sp.seconds)} · ${sp.count} replik</span>` +
    (sp.voice ? `<p class="voice">poznáno po hlase: ${escapeHtml(sp.voice.name)} (shoda ${sp.voice.score.toFixed(2)}) – už použito v přepisu i zápisu; pokud nesedí, opravte jméno a uložte</p>` : "") +
    (sp.hint ? `<p class="hint">${escapeHtml(sp.hint)}</p>` : "");
  if (sp.voice_hint) {
    const vh = sp.voice_hint;
    const p = document.createElement("p"); p.className = "hint";
    p.textContent = `nejpodobnější hlas: ${vh.name} (shoda ${vh.score.toFixed(2)}, ${vh.why}, nepřiřazeno automaticky) `;
    const use = document.createElement("button"); use.type = "button"; use.className = "play"; use.textContent = "použít toto jméno";
    use.onclick = () => { setFields(vh.fields); /** @type {HTMLInputElement|null} */ (side.querySelector('[data-key="first"]'))?.focus(); };
    p.appendChild(use);
    left.appendChild(p);
  }
  const samples = document.createElement("div"); samples.className = "samples";
  if (!review || !review.has_mix) samples.innerHTML = '<span class="excerpt">zvuk nahrávky chybí</span>';
  for (const s of sp.samples) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = `▶ ${s.at}`; b.title = s.text;
    b.onclick = () => play(b, s);
    samples.appendChild(b);
  }
  left.appendChild(samples);
  for (const e of sp.excerpts) {
    const p = document.createElement("p"); p.className = "excerpt";
    p.innerHTML = `<b>${e.at}</b> ${escapeHtml(e.text)}`;
    left.appendChild(p);
  }
  const side = document.createElement("div"); side.className = "side"; side.dataset.label = sp.label;
  const field = (/** @type {keyof Fields} */ key, /** @type {string} */ labelText, /** @type {string} */ ph) => {
    const wrap = document.createElement("div");
    const lab = document.createElement("label"); lab.textContent = labelText;
    const inp = document.createElement("input"); inp.type = "text"; inp.placeholder = ph; inp.autocomplete = "off";
    inp.value = sp.fields[key] || ""; inp.dataset.key = key;
    inp.addEventListener("input", updateShown);
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); focusNext(i); } });
    wrap.appendChild(lab); wrap.appendChild(inp);
    return wrap;
  };
  const row1 = document.createElement("div"); row1.className = "row";
  row1.appendChild(field("first", "Jméno", "Petr")); row1.appendChild(field("last", "Příjmení", "Svoboda"));
  const row2 = document.createElement("div"); row2.className = "row";
  row2.appendChild(field("nick", "Přezdívka", "Péťa"));
  const modeWrap = document.createElement("div");
  const modeLab = document.createElement("label"); modeLab.textContent = "V zápisu";
  const mode = document.createElement("select"); mode.dataset.key = "display";
  for (const m of ["", "first", "full", "nick"]) {
    const o = document.createElement("option"); o.value = m; o.textContent = m ? MODE_LABEL[m] : `výchozí (${MODE_LABEL[displayDefault]})`;
    if ((sp.fields.display || "") === m) o.selected = true; mode.appendChild(o);
  }
  mode.addEventListener("change", updateShown);
  modeWrap.appendChild(modeLab); modeWrap.appendChild(mode); row2.appendChild(modeWrap);
  side.appendChild(row1); side.appendChild(row2);
  const shown = document.createElement("div"); shown.className = "shown";
  side.appendChild(shown);

  const head = /** @type {HTMLElement|null} */ (left.querySelector(".label"));
  function fields() { return collectFields(side); }
  function updateShown() {
    const f = fields();
    const full = `${f.first} ${f.last}`.trim() || f.nick;
    if (head) head.textContent = full || sp.label;  // the heading is the person, not the label under it
    if (!(f.first || f.last || f.nick)) { shown.innerHTML = sp.unresolved ? "prázdné = nechat SPEAKER" : ""; return; }
    const known = personFor(f);
    shown.innerHTML = `v zápisu: <b>${escapeHtml(shownFor(f))}</b>${known ? "" : " · nová osoba"}`;
  }
  function setFields(/** @type {Fields} */ f) {
    for (const k of /** @type {const} */ (["first", "last", "nick", "display"])) {
      const el = /** @type {HTMLInputElement|HTMLSelectElement|null} */ (side.querySelector(`[data-key="${k}"]`));
      if (el) el.value = f[k] || "";
    }
    updateShown();
  }
  if (people.length) {
    const pickP = document.createElement("select"); pickP.className = "same";
    pickP.innerHTML = '<option value="">vybrat známou osobu…</option>' +
      people.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(`${p.first} ${p.last}`.trim() || p.nick)}${p.nick ? " (" + escapeHtml(p.nick) + ")" : ""}</option>`).join("");
    pickP.onchange = () => {
      const p = people.find(x => x.id === pickP.value);
      if (p) setFields({ first: p.first, last: p.last, nick: p.nick, display: p.display });
      pickP.value = ""; updateDirty();
    };
    side.appendChild(pickP);
  }
  const others = (review ? review.speakers : []).filter(o => o.label !== sp.label);
  if (others.length) {
    const sel = document.createElement("select"); sel.className = "same";
    sel.innerHTML = '<option value="">stejná osoba jako…</option>' +
      others.map(o => `<option value="${escapeHtml(o.label)}">${escapeHtml(o.label)}${o.name && o.name !== o.label ? " = " + escapeHtml(o.name) : ""}</option>`).join("");
    sel.onchange = () => {
      const src = /** @type {HTMLElement|null} */ (main.querySelector(`.side[data-label="${CSS.escape(sel.value)}"]`));
      if (src) { const f = collectFields(src); if (!(f.first || f.last || f.nick)) f.first = sel.value; setFields(f); }
      sel.value = ""; updateDirty();
    };
    side.appendChild(sel);
  }
  updateShown();
  const rm = document.createElement("button"); rm.type = "button"; rm.className = "link danger small";
  rm.textContent = "✕ smazat repliky tohoto mluvčího (šum, klikání, vymyšlený text)";
  rm.title = "odstraní všechny jeho repliky z přepisu a titulků; přepis --force je vrátí";
  armedButton(rm, `Potvrdit smazání ${sp.count} replik mluvčího ${sp.label}`, async () => {
    setStatus("mažu…");
    try {
      const r = await api(recUrl(review ? review.stem : "", "speakers", sp.label), send("DELETE"));
      if (review) { const stem = review.stem; await loadList(); pick.value = stem; await loadRecording(stem); }
      setStatus(`smazáno ${r.removed} replik a rovnou uloženo (přepis a titulky přegenerovány); zápis je beze změny, přegenerujte ho tlačítkem dole, pokud chcete`, "ok");
    } catch (e) { setStatus(String(e), "err"); }
  });
  side.appendChild(rm);
  c.appendChild(left); c.appendChild(side);
  return c;
}

/** @param {HTMLElement} side @returns {Fields} */
function collectFields(side) {
  const get = (/** @type {string} */ k) => /** @type {HTMLInputElement|HTMLSelectElement|null} */ (side.querySelector(`[data-key="${k}"]`));
  return { first: get("first")?.value.trim() || "", last: get("last")?.value.trim() || "",
    nick: get("nick")?.value.trim() || "", display: get("display")?.value || "" };
}

function focusNext(/** @type {number} */ i) {
  const sides = /** @type {HTMLElement[]} */ ([...main.querySelectorAll(".side")]);
  const next = sides[i + 1] ? /** @type {HTMLInputElement|null} */ (sides[i + 1].querySelector('[data-key="first"]')) : null;
  (next || /** @type {HTMLButtonElement} */ ($("save"))).focus();
}

/** @param {HTMLButtonElement} btn @param {Sample} s @param {string=} stem */
function play(btn, s, stem) {
  if (playingBtn === btn && !audio.paused) { stopAudio(); return; }
  stopAudio();
  const which = stem || (review ? review.stem : "");
  if (!which) return;
  audio.src = `${recUrl(which, "clip")}?start=${s.start}&end=${s.end}`;
  audio.play().catch(e => setStatus(`přehrávání selhalo: ${e}`, "err"));
  btn.classList.add("playing"); playingBtn = btn;
}
function stopAudio() {
  audio.pause();
  if (playingBtn) playingBtn.classList.remove("playing");
  playingBtn = null;
}
audio.onended = stopAudio;

/** @returns {Record<string,Fields>} */
function collectNames() {
  /** @type {Record<string,Fields>} */ const names = {};
  for (const el of main.querySelectorAll(".side[data-label]")) {
    const side = /** @type {HTMLElement} */ (el);
    names[String(side.dataset.label)] = collectFields(side);
  }
  return names;
}

async function save(/** @type {boolean} */ withSummary) {
  if (!review) return;
  const buttons = [$("save"), $("saveSum")].map(b => /** @type {HTMLButtonElement} */ (b));
  buttons.forEach(b => b.disabled = true);
  setStatus("ukládám…");
  const since = finishes;
  try {
    const r = await api(recUrl(review.stem, "names"),
      send("PUT", { names: collectNames(), summary: withSummary, title: titleInput.value }));
    const n = Object.keys(r.written).length;
    setStatus(`uloženo (${n} jmen), přepis a titulky přegenerovány${withSummary ? ", zápis se generuje…" : ""}`, "ok");
    if (withSummary) { setBusy(true); try { await waitForSummary(since); } finally { setBusy(false); } }
    const stem = r.stem || review.stem;  // a new title renames the folder, so the stem may have changed
    await loadList(); pick.value = stem;
    await loadRecording(stem);  // people may have been created; refresh the "v zápisu" previews
    if (withSummary) { setStatus("uloženo, zápis přegenerován", "ok"); if (subTab === "summary") renderDoc(); }
    else setStatus(`uloženo (${n} jmen), přepis a titulky přegenerovány`, "ok");
  } catch (e) {
    setStatus(String(e), "err");
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

async function waitForSummary(/** @type {number} */ since) {
  setStatus("zápis se generuje (lokální model, 1–3 min) – nezavírejte tuto stránku ani okno konzole, jinak se přeruší", "busy");
  const error = await waitForJob(since);
  if (error) setStatus(`zápis se nepodařil: ${error}`, "err");
}

// a background job (processing, minutes) ended: the event stream says so at once, polling when it is down
let finishes = 0;
/** @type {{text:string,level:string}|null} */ let lastFinish = null;  // the event with job_end
/** @type {(() => void)[]} */ let finishWaiters = [];
function noteFinish(/** @type {{text:string,level:string}|undefined} */ ev) {
  finishes += 1;
  lastFinish = ev || null;
  finishWaiters.splice(0).forEach(wake => wake());
}
/** Wait until a job that started after `since` finishes; the error text, or "" when it went well. The event
 * stream wakes this at once; without it a status check every 10 s notices the end. */
async function waitForJob(/** @type {number} */ since) {
  for (;;) {
    if (finishes > since) return lastFinish && lastFinish.level === "err" ? lastFinish.text : "";
    const woken = await new Promise(res => {
      finishWaiters.push(() => res(true));
      setTimeout(() => res(false), 10000);
    });
    if (woken) continue;
    const s = await api("/api/status");
    if (!s.busy) return s.error || "";
  }
}

  if (r.path) $("scope").textContent = `společný seznam lidí pro všechny nahrávky (${r.path})`;

function renderPeople() {
  peopleMain.innerHTML = `<p class="people-help">Co se píše do přepisu a zápisu: výchozí volba je <b>${MODE_LABEL[displayDefault] || displayDefault}</b>

/** @param {Person} p */
function personRow(p) {
  const tr = document.createElement("tr");
  tr.dataset.id = p.id;
  if (p.id) {  // click the name to open the detail with the stored voice prints
    tr.addEventListener("dblclick", ev => { if (ev.target instanceof HTMLInputElement) return; openPerson(p.id); });
  }
  const cell = (/** @type {string} */ key, /** @type {string} */ ph = "") => {
    const td = document.createElement("td");
    const inp = document.createElement("input"); inp.type = "text"; inp.value = /** @type {any} */ (p)[key] || ""; inp.placeholder = ph;
    inp.dataset.key = key; td.appendChild(inp); return td;
  };
  tr.appendChild(cell("first", "Petr")); tr.appendChild(cell("last", "Svoboda")); tr.appendChild(cell("nick", "Péťa"));
  const tdMode = document.createElement("td");
  const sel = document.createElement("select"); sel.dataset.key = "display";
  for (const m of ["", "first", "full", "nick"]) {
    const o = document.createElement("option"); o.value = m; o.textContent = MODE_LABEL[m]; if (p.display === m) o.selected = true; sel.appendChild(o);
  }
  tdMode.appendChild(sel); tr.appendChild(tdMode);
  const tdAl = document.createElement("td");
  const al = document.createElement("input"); al.type = "text"; al.value = (p.aliases || []).join(", "); al.placeholder = "Petr Svoboda (NG)"; al.dataset.key = "aliases";
  tdAl.appendChild(al); tr.appendChild(tdAl);
  const tdPr = document.createElement("td");
  const ok = document.createElement("input"); ok.type = "checkbox"; ok.dataset.key = "voiceprint";
  ok.checked = p.voiceprint !== false;
  ok.title = "poznávat po hlase (ukládat hlasový otisk); zrušení smaže jeho otisky při Uložit lidi";
  tdPr.appendChild(ok);
  if (p.id) {
    const b = document.createElement("button"); b.type = "button"; b.className = "link";
    b.textContent = ` ${p.prints || 0} · detail`; b.title = "uložené hlasové otisky a ukázky";
    b.onclick = () => openPerson(p.id);
    tdPr.appendChild(b);
  }
  tr.appendChild(tdPr);
  const tdMerge = document.createElement("td");
  if (p.id) {
    const ms = document.createElement("select"); ms.className = "same";
    ms.innerHTML = '<option value="">sloučit do…</option>' + people.filter(o => o.id && o.id !== p.id)
      .map(o => `<option value="${escapeHtml(o.id)}">${escapeHtml(`${o.first} ${o.last}`.trim() || o.nick)}</option>`).join("");
    ms.onchange = () => { if (ms.value) mergePerson(ms.value, p.id); ms.value = ""; };
    tdMerge.appendChild(ms);
  }
  tr.appendChild(tdMerge);
  const tdAct = document.createElement("td"); tdAct.className = "act";
  const del = document.createElement("button"); del.type = "button"; del.title = "odebrat osobu (potvrdit druhým klikem, uloží se tlačítkem Uložit lidi)"; del.textContent = "✕";
  armedButton(del, "Potvrdit odebrání", () => tr.remove());
  tdAct.appendChild(del); tr.appendChild(tdAct);
  return tr;
}

/** @returns {Person[]} */
function collectPeople() {
  /** @type {Person[]} */ const out = [];
  for (const tr of peopleMain.querySelectorAll("tbody tr")) {
    const row = /** @type {HTMLTableRowElement} */ (tr);
    const get = (/** @type {string} */ k) => /** @type {HTMLInputElement|HTMLSelectElement|null} */ (row.querySelector(`[data-key="${k}"]`));
    out.push({ id: row.dataset.id || "", first: get("first")?.value.trim() || "", last: get("last")?.value.trim() || "",
      nick: get("nick")?.value.trim() || "", display: get("display")?.value || "",
      aliases: (get("aliases")?.value || "").split(",").map(s => s.trim()).filter(Boolean),
      voiceprint: /** @type {HTMLInputElement|null} */ (get("voiceprint"))?.checked !== false });
  }
  return out;
}

  const btn = /** @type {HTMLButtonElement} */ ($("savePeople"));

    people = r.people; renderPeople();

  stopAudio(); setStatus("");
  peopleMain.innerHTML = '<div class="empty">Načítám…</div>';
  /** @type {PersonDetail} */ let d;
  try { d = await api(`/api/people/${encodeURIComponent(id)}`); }

  peopleMain.innerHTML = "";
  const back = document.createElement("button"); back.type = "button"; back.className = "link"; back.textContent = "← Lidé";
  back.onclick = () => loadPeople();
  peopleMain.appendChild(back);
  const h = document.createElement("h2"); h.className = "person-h";
  h.textContent = `${d.first} ${d.last}`.trim() || d.nick;
  peopleMain.appendChild(h);
  const info = document.createElement("p"); info.className = "people-help";
  info.innerHTML = `id <code>${escapeHtml(d.id)}</code> · v zápisu: <b>${escapeHtml(d.shown)}</b>` +
    (d.nick ? ` · přezdívka ${escapeHtml(d.nick)}` : "") + (d.aliases.length ? ` · aliasy: ${escapeHtml(d.aliases.join(", "))}` : "") +
    `<br>Otisky: ${d.prints.length} (jeden na nahrávku = průměr hlasu v ní, nejvýš 10 nejnovějších; model ${escapeHtml(d.model || "?")}). ` +
    `Přiřazen v nahrávkách: ${d.recordings.length ? d.recordings.map(s => `<code>${escapeHtml(s)}</code>`).join(", ") : "zatím žádné"}.`;
  peopleMain.appendChild(info);
  if (!d.prints.length) {
    peopleMain.appendChild(emptyBox("Žádný hlasový otisk. Vznikne, až tuto osobu pojmenujete u nahrávky, kde mluví aspoň 30 s."));
  } else {
    const t = document.createElement("table");
    t.innerHTML = `<thead><tr><th>Nahrávka</th><th>Označení</th><th>Mluvil</th><th>Uloženo</th><th>Ukázky</th><th>Otisk</th><th></th></tr></thead>`;
    const tb = document.createElement("tbody");
    for (const pr of d.prints) {
      const tr = document.createElement("tr");
      const cells = [
        `${fmtDate(pr.start || "")} ${escapeHtml(pr.title || pr.stem)}`, escapeHtml(pr.label),
        pr.seconds != null ? fmtMin(pr.seconds) : "?", fmtDate(pr.added || ""),
      ];
      for (const c of cells) { const td = document.createElement("td"); td.innerHTML = c; tr.appendChild(td); }
      const tdS = document.createElement("td"); tdS.className = "samples";
      if (pr.samples.length && pr.has_mix) {
        for (const s of pr.samples) {
          const b = document.createElement("button"); b.type = "button"; b.className = "play";
          b.textContent = `▶ ${s.at}`; b.title = s.text;
          b.onclick = () => play(b, s, pr.stem);
          tdS.appendChild(b);
        }
      } else tdS.textContent = "zvuk chybí";
      tr.appendChild(tdS);
      const tdV = document.createElement("td"); tdV.textContent = `${pr.dims} hodnot`; tr.appendChild(tdV);
      const tdX = document.createElement("td"); tdX.className = "act";
      const del = document.createElement("button"); del.type = "button"; del.textContent = "✕"; del.title = "smazat tento otisk (potvrdit druhým klikem)";
      armedButton(del, "Potvrdit smazání otisku", async () => {
        try { await api(`/api/people/${encodeURIComponent(d.id)}/voiceprints?stem=${encodeURIComponent(pr.stem)}&label=${encodeURIComponent(pr.label)}`, send("DELETE")); openPerson(d.id); }
        catch (e) { setStatus(String(e), "err"); }
      });
      tdX.appendChild(del); tr.appendChild(tdX);
      tb.appendChild(tr);
    }
    t.appendChild(tb); peopleMain.appendChild(t);
    const all = document.createElement("button"); all.type = "button"; all.className = "link danger"; all.textContent = "smazat všechny otisky této osoby";
    armedButton(all, "opravdu smazat všechny otisky? (klikněte znovu)", async () => {
      try { await api(`/api/people/${encodeURIComponent(d.id)}/voiceprints`, send("DELETE")); openPerson(d.id); }
      catch (e) { setStatus(String(e), "err"); }
    });
    peopleMain.appendChild(all);
  }
}

async function mergePerson(/** @type {string} */ keep, /** @type {string} */ drop) {
  const k = people.find(p => p.id === keep), d = people.find(p => p.id === drop);
  if (!k || !d) return;
  setStatus(`slučuji ${`${d.first} ${d.last}`.trim()} do ${`${k.first} ${k.last}`.trim()}…`);
  try {
    const r = await api("/api/people/merge", send("POST", { keep, drop, stem: review ? review.stem : null }));
    people = r.people; await loadPeople();
    setStatus("sloučeno, přiřazení v nahrávkách přepsána", "ok");
  } catch (e) { setStatus(String(e), "err"); }
}

/** the documents of the open sub-tab: the transcript and comparison transcripts, or the summaries */
function docList() {
  if (!review || !review.docs) return [];
  if (subTab === "transcript") {
    const main = review.docs.transcript ? [{ file: review.docs.transcript, label: "přepis (hlavní)" }] : [];
    return main.concat(review.docs.transcripts || []);
  }
  return subTab === "summary" ? review.docs.summaries : [];
}

async function renderDoc() {
  if (!review || !review.docs) { docMain.innerHTML = '<div class="empty">Nahrávka ještě nemá přepis.</div>'; return; }
  let file = null;
  const list = docList();
  if (list.length) {
    const key = `${review.stem}:${subTab}`;
    if (!docPick.options.length || docPick.dataset.stem !== key) {
      docPick.innerHTML = list.map(d => `<option value="${escapeHtml(d.file)}">${escapeHtml(d.label)}</option>`).join("");
      docPick.dataset.stem = key;
    }
    file = docPick.value || list[0].file;
  }
  if (!file) { docMain.innerHTML = `<div class="empty">${subTab === "transcript" ? "Přepis zatím není." : "Zápis zatím není – vytvoříte ho tlačítkem „Uložit a přegenerovat zápis“ na záložce Mluvčí."}</div>`; return; }
  docMain.innerHTML = '<div class="empty">Načítám…</div>';
  try {
    const r = await api(recUrl(review.stem, "docs", file));
    docMain.innerHTML = subTab === "transcript" ? renderTranscript(r.text) : renderMarkdown(r.text);
  } catch (e) { docMain.innerHTML = `<div class="empty">${escapeHtml(String(e))}</div>`; }
}

/** the .txt export: header lines, then [hh:mm:ss] Name: text */
function renderTranscript(/** @type {string} */ text) {
  const out = [];
  const metaLines = [];
  for (const raw of text.split(/\r?\n/)) {
    const m = raw.match(/^\[(\d\d:\d\d:\d\d)\] (?:([^:]{1,60}): )?(.*)$/);
    if (m) out.push(`<div class="line"><span class="t">${m[1]}</span><span class="who">${escapeHtml(m[2] || "")}</span><span>${escapeHtml(m[3])}</span></div>`);
    else if (raw.startsWith("# ")) out.push(`<h1>${escapeHtml(raw.slice(2))}</h1>`);
    else if (raw.trim()) metaLines.push(escapeHtml(raw));
  }
  if (metaLines.length) out.splice(out[0] && out[0].startsWith("<h1>") ? 1 : 0, 0, `<div class="meta-block">${metaLines.join("<br>")}</div>`);
  return out.join("");
}

/** Links in the minutes come from an LLM that read what people said, so only web, mail and relative targets
 * become links; `javascript:` and other schemes stay plain text. */
function safeHref(/** @type {string} */ href) {
  const scheme = href.match(/^([a-z][a-z0-9+.-]*):/i);
  return !scheme || ["http", "https", "mailto"].includes(scheme[1].toLowerCase());
}

/** minimal Markdown: headings, paragraphs, bullet/numbered lists, tables, bold/italic/code, HTML comments as a stamp */
function renderMarkdown(/** @type {string} */ md) {
  const inline = (/** @type {string} */ s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => safeHref(href) ? `<a href="${href}">${text}</a>` : text)
    .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1">$1</a>');
  const lines = md.split(/\r?\n/);
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    const cm = line.match(/^<!--\s*(.*?)\s*-->$/);
    if (cm) { out.push(`<div class="stamp">${escapeHtml(cm[1])}</div>`); i++; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = (/** @type {string} */ r) => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const [head, ...rest] = rows.filter(r => !/^[\s|:-]+$/.test(r));  // drop the |---|---| separator
      out.push("<table><thead><tr>" + cells(head).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rest.map(r => "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    const lm = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (lm) {
      const ordered = /\d/.test(lm[2]);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length) {
        const m2 = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (!m2) break;
        const depth = Math.floor(m2[1].replace(/\t/g, "  ").length / 2);
        items.push({ depth, text: m2[3] });
        i++;
      }
      let html = `<${tag}>`; let cur = 0;
      for (const it of items) {
        while (cur < it.depth) { html += "<ul>"; cur++; }
        while (cur > it.depth) { html += "</ul>"; cur--; }
        html += `<li>${inline(it.text)}</li>`;
      }
      while (cur > 0) { html += "</ul>"; cur--; }
      out.push(html + `</${tag}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|\||\s*([-*]|\d+\.)\s|<!--)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

$("quit").onclick = async () => {
  if (busy) { setStatus("zápis se generuje, počkejte na dokončení", "busy"); return; }
  stopAudio();
  try { await api("/api/quit", { method: "POST" }); }
  catch (e) { if (String(e).includes("generated")) { setStatus("zápis se generuje, počkejte na dokončení", "busy"); return; } }
  document.body.innerHTML = '<div class="empty">Hotovo, tuto záložku můžete zavřít.</div>';
};

// ---- help: the guides from docs/, shown over the page; links between them stay inside
const helpBox = $("help"), helpMain = $("helpMain"), helpPick = /** @type {HTMLSelectElement} */ ($("helpPick"));

async function openHelp(/** @type {string} */ doc) {
  helpBox.hidden = false;
  helpPick.value = doc;
  helpMain.innerHTML = '<div class="empty">Načítám…</div>';
  /** @type {any} */ let r;
  try { r = await api(`/api/help/${encodeURIComponent(doc)}`); }
  catch (e) { helpMain.innerHTML = `<div class="empty">${escapeHtml(String(e))}</div>`; return; }
  if (r.url) {  // no local docs folder (installed package): the same page on GitHub
    helpMain.innerHTML = `<p>Nápověda k této instalaci je na webu: <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a></p>`;
    return;
  }
  helpMain.innerHTML = renderMarkdown(r.text);
  helpBox.scrollTop = 0;
  for (const a of helpMain.querySelectorAll("a")) {
    const href = a.getAttribute("href") || "";
    const local = href.match(/(?:^|\/)(user-guide|install|privacy)\.md(?:#.*)?$/);
    if (local) {
      a.addEventListener("click", ev => { ev.preventDefault(); openHelp(local[1]); });
    } else if (/^https?:/.test(href)) {
      a.target = "_blank"; a.rel = "noopener";
    }
  }
}

function closeHelp() { helpBox.hidden = true; }
$("helpBtn").onclick = () => openHelp(helpPick.value || "user-guide");
$("helpClose").onclick = closeHelp;
helpPick.onchange = () => openHelp(helpPick.value);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !helpBox.hidden) closeHelp(); });
setInterval(() => { fetch("/api/ping", { method: "POST" }).catch(() => {}); }, 15000);

// ---- event log: the server says what it did, the page shows the newest line and reloads when needed
/** @type {{n:number,at:string,text:string,level:string,stem:string,reload:boolean,job_end?:boolean}[]} */
let events = [];
let lastSeq = -1;
let wasBusy = false;

function renderEvents() {
  const box = $("events");
  if (box.hidden) return;
  box.innerHTML = events.length
    ? events.slice().reverse().map(e =>
        `<div class="ev ${escapeHtml(e.level)}"><span class="at">${escapeHtml(e.at)}</span>` +
        `<span class="tx">${escapeHtml(e.text)}</span></div>`).join("")
    : '<div class="empty-ev">Zatím se nic nestalo.</div>';
}

async function pollStatus() {
  /** @type {any} */ let s;
  try {
    s = await api("/api/status");
  } catch {
    return;  // the server is gone or busy; the next tick tries again
  }
  events = s.events || [];
  const fresh = events.filter(e => e.n > lastSeq);
  const first = lastSeq < 0;
  lastSeq = typeof s.seq === "number" ? s.seq : lastSeq;
  const finished = wasBusy && !s.busy;   // a background job ended: what is on the screen is stale
  wasBusy = !!s.busy;
  for (const e of fresh) if (e.job_end && !first) noteFinish(e);
  if (first) { renderEvents(); return; }  // the page just opened: keep the old lines, do not shout them
  if (!fresh.length && !finished) return;
  const mine = finished || fresh.some(e => e.reload && (!e.stem || (review && e.stem === review.stem)));
  if (mine && review && !isDirty() && !busy) {
    const stem = review.stem;
    await loadList(); pick.value = stem; await loadRecording(stem);  // clears the status line, so write it after
  }
  const last = fresh[fresh.length - 1];
  if (last) setStatus(`${last.at} · ${last.text}`, last.level === "err" ? "err" : last.level === "busy" ? "busy" : "ok");
  renderEvents();
}

$("histBtn").addEventListener("click", () => {
  const box = $("events");
  box.hidden = !box.hidden;
  renderEvents();
});
/** one event from the server (SSE or a poll), in order; replayed ones only fill the history */
async function onEvents(/** @type {any[]} */ fresh, /** @type {boolean} */ busyNow, /** @type {boolean} */ replay) {
  for (const e of fresh) if (!events.some(x => x.n === e.n)) events.push(e);
  events.sort((a, b) => a.n - b.n);
  if (events.length > 200) events = events.slice(-200);
  if (fresh.length) lastSeq = Math.max(lastSeq, ...fresh.map(e => e.n));
  const finished = wasBusy && !busyNow;
  wasBusy = busyNow;
  if (!replay) for (const e of fresh) if (e.job_end) noteFinish(e);
  if (replay) { renderEvents(); return; }
  const mine = finished || fresh.some(e => e.reload && (!e.stem || (review && e.stem === review.stem)));
  if (mine && review && !isDirty() && !busy) {
    const stem = review.stem;
    await loadList(); pick.value = stem; await loadRecording(stem);  // clears the status line, so write it after
  }
  const last = fresh[fresh.length - 1];
  if (last) setStatus(`${last.at} · ${last.text}`, last.level === "err" ? "err" : last.level === "busy" ? "busy" : "ok");
  renderEvents();
}

let pollTimer = 0;
function startPolling() {
  if (pollTimer) return;
  pollTimer = window.setInterval(() => { pollStatus().catch(() => {}); }, 5000);
  pollStatus().catch(() => {});
}

/** Server-Sent Events: the browser reconnects by itself and asks for what it missed (Last-Event-ID) */
function startEvents() {
  if (typeof EventSource === "undefined") { startPolling(); return; }
  const es = new EventSource("/api/events");
  let failures = 0;
  es.addEventListener("hello", ev => {
    failures = 0;
    const h = JSON.parse(/** @type {MessageEvent} */ (ev).data);
    wasBusy = !!h.busy;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = 0; }
  });
  es.addEventListener("log", ev => {
    const e = JSON.parse(/** @type {MessageEvent} */ (ev).data);
    onEvents([e], !!e.busy, !!e.replay).catch(() => {});
  });
  es.onerror = () => {
    failures += 1;
    if (failures >= 3) { es.close(); startPolling(); }  // a proxy or an old server: fall back to polling
  };
}
startEvents();

(async () => {
  try {
    await loadList();
    if (pick.value) await loadRecording(pick.value);
    else main.innerHTML = '<div class="empty">Žádná nahrávka ve složce nahrávek.</div>';
  } catch (e) { main.innerHTML = `<div class="empty">${escapeHtml(String(e))}</div>`; }
})();
